<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웨비나 참가 신청</title>
  <meta name="description" content="무료 온라인 웨비나 참가 신청 페이지">
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --primary: #5b4bdb;
      --primary-dark: #4636c0;
      --border: #e3e6ee;
      --ok: #137a4b;
      --err: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .hero {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      text-align: center;
      padding: 72px 20px 110px;
    }
    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      font-size: 0.85rem;
      margin-bottom: 18px;
    }
    .hero h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 5vw, 2.8rem); line-height: 1.25; }
    .hero p { margin: 0 auto; max-width: 560px; opacity: 0.92; font-size: 1.05rem; }
    .info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 28px;
      margin-top: 28px;
      font-size: 0.98rem;
    }
    .wrap {
      max-width: 880px;
      margin: -56px auto 60px;
      padding: 0 20px;
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 6px 24px rgba(30, 36, 60, 0.08);
    }
    .card h2 { margin: 0 0 14px; font-size: 1.2rem; }
    ul { margin: 0; padding-left: 20px; }
    li { margin-bottom: 8px; }
    label { display: block; font-weight: 600; font-size: 0.92rem; margin: 14px 0 6px; }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      background: #fff;
    }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }
    .agree { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin-top: 16px; }
    .agree input { width: auto; margin-top: 5px; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: 0.6; cursor: wait; }
    #msg { margin-top: 14px; font-size: 0.93rem; min-height: 1.4em; }
    #msg.ok { color: var(--ok); }
    #msg.err { color: var(--err); }
    footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding-bottom: 40px; }
  </style>
</head>
<body>
  <header class="hero">
    <span class="badge">무료 온라인 웨비나</span>
    <h1>웨비나 제목을 여기에 입력하세요</h1>
    <p>핵심 주제와 얻어갈 내용을 한두 문장으로 소개하는 문구입니다.</p>
    <div class="info">
      <span>📅 2026년 11월 19일 (목)</span>
      <span>🕗 오후 8:00 – 9:30 (KST)</span>
      <span>💻 Zoom 온라인 진행</span>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>이런 내용을 다뤄요</h2>
      <ul>
        <li>첫 번째 핵심 주제</li>
        <li>두 번째 핵심 주제</li>
        <li>세 번째 핵심 주제</li>
        <li>질의응답 시간</li>
      </ul>
      <h2 style="margin-top:24px">진행자</h2>
      <p style="margin:0">진행자 이름 · 소속 / 직함</p>
    </section>

    <section class="card">
      <h2>참가 신청</h2>
      <form id="form" novalidate>
        <label for="name">이름</label>
        <input id="name" name="name" type="text" autocomplete="name" required>

        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="참가 링크를 받을 주소">

        <label for="job">직군 (선택)</label>
        <select id="job" name="job">
          <option value="">선택해주세요</option>
          <option>학생</option>
          <option>개발자</option>
          <option>디자이너</option>
          <option>기획/마케팅</option>
          <option>기타</option>
        </select>

        <label class="agree">
          <input id="agree" type="checkbox" required>
          <span>참가 안내를 위해 이름과 이메일을 수집하는 데 동의합니다.</span>
        </label>

        <button id="submit" type="submit">신청하기</button>
        <div id="msg" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer>© 2026 웨비나 운영팀</footer>

  <script>
    // 신청 내용을 받을 주소(Formspree, Google Apps Script 등)를 여기에 넣으면 실제로 접수돼요.
    // 비어 있는 동안에는 샘플 모드로, 완료 화면만 보여주고 아무것도 저장하지 않아요.
    const ENDPOINT = "";

    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit");

    function show(text, type) {
      msg.textContent = text;
      msg.className = type;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = form.name.value.trim();
      const email = form.email.value.trim();

      if (!name) return show("이름을 입력해주세요.", "err");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show("이메일 형식을 확인해주세요.", "err");
      if (!form.agree.checked) return show("개인정보 수집에 동의해주세요.", "err");

      if (!ENDPOINT) {
        form.reset();
        return show("샘플 화면이에요. 신청이 완료된 것처럼 보이지만 입력한 내용은 저장되지 않아요.", "ok");
      }

      btn.disabled = true;
      show("신청 중...", "");
      try {
        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ name, email, job: form.job.value })
        });
        if (!res.ok) throw new Error(res.status);
        form.reset();
        show("신청이 완료되었어요! 입력하신 이메일로 안내를 보내드릴게요.", "ok");
      } catch (err) {
        show("신청 중 문제가 생겼어요. 잠시 후 다시 시도해주세요.", "err");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
